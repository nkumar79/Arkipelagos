<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>loading…</title>
    <meta name="theme-color" content="#0b0b0d">
    <link rel="icon" id="icon" href="data:,">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <style>
        /* Kept inline on purpose: the loader has to paint before any network request finishes. */
        :root {
            color-scheme: dark;
            --bg: #0b0b0d;
            --panel: #131317;
            --line: rgba(255, 255, 255, .1);
            --fg: #ececf1;
            --muted: #8a8a96;
            --accent: #8b7cff;
            --ease: cubic-bezier(.2, .7, .2, 1);
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            background: var(--bg)
        }

        body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            color: var(--fg);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        /* stage: one iframe per page, all kept alive, only one visible */
        #stage {
            position: absolute;
            inset: 0
        }

        .page-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: var(--bg);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .2s var(--ease), visibility 0s .2s;
        }

        .page-frame.on {
            z-index: 1;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity .2s var(--ease);
        }

        /* loader */
        .loader {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            background: var(--bg);
            transition: opacity .35s var(--ease), visibility .35s;
        }

        body.ready .loader {
            opacity: 0;
            visibility: hidden;
            pointer-events: none
        }

        .spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .12);
            border-top-color: var(--accent);
            animation: rot .8s linear infinite;
        }

        /* thin progress bar for later page switches (the current page stays visible) */
        .bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 3;
            overflow: hidden;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none
        }

        body.busy .bar {
            opacity: 1
        }

        .bar::before {
            content: "";
            position: absolute;
            inset: 0;
            width: 40%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: sweep 1.1s var(--ease) infinite;
        }

        /* error */
        .error {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: none;
            place-items: center;
            padding: 24px;
            background: var(--bg)
        }

        body.failed .error {
            display: grid
        }

        body.failed .loader {
            opacity: 0;
            visibility: hidden
        }

        .card {
            width: min(420px, 100%);
            padding: 28px;
            border-radius: 18px;
            text-align: center;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8);
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 500
        }

        .card p {
            margin-top: 8px;
            color: var(--muted);
            font-size: .88rem;
            line-height: 1.55
        }

        .card code {
            display: block;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            color: #a9a9b6;
            font: .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
            text-align: left;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 24px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .04);
            font-size: .85rem;
            transition: border-color .2s, background .2s;
        }

        .btn:hover {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 14%, transparent)
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px
        }

        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes sweep {
            from {
                transform: translateX(-100%)
            }

            to {
                transform: translateX(250%)
            }
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="bar" aria-hidden="true"></div>

    <div class="loader" role="status" aria-live="polite">
        <div class="spinner"></div>
    </div>

    <div class="error" role="alert">
        <div class="card">
            <h2>couldn't load the page</h2>
            <p>It didn't come back from the CDN or from this site. Check your connection, or the repo settings in
                <code style="display:inline;margin:0;padding:1px 6px">index.html</code>.
            </p>
            <code id="fail-url"></code>
            <button class="btn" id="retry" type="button">try again</button>
        </div>
    </div>

    <div id="stage"></div>

    <script>
        (() => {
            /* ───────── config ─────────
               Pages are fetched from jsDelivr:
                 https://cdn.jsdelivr.net/gh/<repo>@<ref>/<dir><page>.html
               If that fails (or the URL has ?local, or you're on localhost) they come from this
               site's own <dir> folder instead. */
            const CONFIG = {
                repo: "nkumar79/arkipelagos",   // GitHub repo to fetch from
                ref: "main",                   // branch, tag or commit SHA (a SHA skips CDN cache lag)
                dir: "",                 // folder in the repo that holds the page .html files
                home: "arkipelagos",                 // page shown at the bare URL (pages/index.html)
                timeout: 8000,                 // ms to wait on each source before trying the next
                fresh: true,                   // ask GitHub for the branch's latest commit SHA, so jsDelivr never serves a stale branch cache
                preload: [],                   // pages to load quietly in the background, e.g. ["about", "contact"]
            };

            const LOCAL = new URL("./", location.href).href;
            const LOCAL_FIRST = /[?&]local\b/.test(location.search) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

            const SANDBOX = "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-pointer-lock allow-modals allow-downloads allow-orientation-lock";
            const ALLOW = "fullscreen; gamepad; autoplay; clipboard-write; accelerometer; gyroscope";

            const $ = s => document.querySelector(s);
            const stage = $("#stage");
            const cache = new Map();      // page name -> html text
            const pages = new Map();      // page name -> { el, ready }. iframes live for the whole session
            const meta = new Map();       // page name -> { title, icon }
            let token = 0, gen = 0, current = null, failUrl = "";
            window.currentpage = CONFIG.home;   // pages can read window.parent.currentpage to know if they're visible

            /* ───────── source resolution ───────── */
            /* jsDelivr caches a branch (@main) for hours. With `fresh` on we ask GitHub which commit
               the branch is on right now and load from that exact SHA, which jsDelivr serves
               immediately. If GitHub can't be reached we fall back to the branch name. */
            let lastRef = CONFIG.ref, refP = null;
            const isSha = r => /^[0-9a-f]{40}$/i.test(r);
            const placeholder = /^YOUR_USER\//.test(CONFIG.repo);

            function resolveRef(force) {
                if (!CONFIG.fresh || isSha(CONFIG.ref) || placeholder) return Promise.resolve(lastRef = CONFIG.ref);
                if (refP && !force) return refP;
                return refP = (async () => {
                    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3500);
                    try {
                        const r = await fetch(`https://api.github.com/repos/${CONFIG.repo}/commits/${encodeURIComponent(CONFIG.ref)}`,
                            { headers: { Accept: "application/vnd.github.sha" }, signal: ctl.signal, cache: "no-store" });
                        if (!r.ok) throw new Error(r.status);
                        const sha = (await r.text()).trim();
                        return (lastRef = isSha(sha) ? sha : CONFIG.ref);
                    } catch { return (lastRef = CONFIG.ref); }
                    finally { clearTimeout(t); }
                })();
            }

            const sources = async name => {
                const base = `https://cdn.jsdelivr.net/gh/${CONFIG.repo}@${await resolveRef()}/`;
                const cdn = { url: `${base}${CONFIG.dir}${name}.html`, base };
                const local = { url: `${LOCAL}${CONFIG.dir}${name}.html`, base: LOCAL };
                return LOCAL_FIRST ? [local, cdn] : [cdn, local];
            };

            async function timedFetch(url) {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), CONFIG.timeout);
                try {
                    const res = await fetch(url, { signal: ctl.signal, cache: CONFIG.fresh ? "no-cache" : "default" });
                    if (!res.ok) throw new Error(res.status);
                    return await res.text();
                } finally { clearTimeout(t); }
            }

            // A page that says "../something.ext" (stylesheet, image, script, json...) means a file at
            // the repo root, but ../ means nothing inside a srcdoc. Point every one at the place the
            // page itself came from. ../ links to .html pages are left alone: the shell routes those.
            const ASSET = /(["'])\.\.\/([\w.%\/-]+\.[A-Za-z0-9]+)\1/g;
            const rewrite = (html, base) =>
                html.replace(ASSET, (m, q, p) => (/\.html?$/i.test(p) ? m : `${q}${base}${p}${q}`));

            // jsDelivr serves .html as text/plain, so a page can't be iframed by URL.
            // Fetch the source and hand it to the frame as srcdoc.
            async function getPage(name) {
                if (cache.has(name)) return cache.get(name);
                let lastErr;
                const list = await sources(name);
                failUrl = list[0].url;
                for (const src of list) {
                    try {
                        const html = rewrite(await timedFetch(src.url), src.base);
                        cache.set(name, html);
                        return html;
                    } catch (e) { lastErr = e; }
                }
                throw lastErr;
            }

            /* ───────── routing ───────── */
            const pageFromHash = () => {
                const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
                return /^[\w-]+$/.test(h) ? h : CONFIG.home;
            };

            const setState = s => {
                document.body.classList.remove("loading", "ready", "failed");
                document.body.classList.add(s);
            };

            // keep navigation inside the shell
            function wire(doc) {
                doc.addEventListener("click", e => {
                    const a = e.target.closest && e.target.closest("a[href]");
                    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
                    const href = a.getAttribute("href");

                    if (/^(https?:)?\/\//i.test(href) || /^(mailto|tel):/i.test(href)) {
                        a.target = "_blank"; a.rel = "noopener noreferrer"; return;
                    }
                    if (href.startsWith("#") || href === "") return;

                    e.preventDefault();
                    const name = href.split("#")[0].split("?")[0].split("/").pop().replace(/\.html$/i, "") || CONFIG.home;
                    const next = name === CONFIG.home ? "" : `#/${name}`;
                    if ((location.hash || "") === next) return;
                    location.hash = next;
                });
            }

            /* ───────── pages ─────────
               Each page gets its own iframe the first time it's opened and keeps it.
               Switching only shows one and hides the rest, so nothing reloads. */
            function purge() {
                gen++; token++;
                for (const { el } of pages.values()) el.remove();
                pages.clear();
                current = null;
            }

            function ensure(name) {          // resolves to the page's iframe, creating it if needed
                const hit = pages.get(name);
                if (hit) return hit.ready;

                const el = document.createElement("iframe");
                el.className = "page-frame";
                el.title = "content";
                el.dataset.page = name;      // pages can read window.frameElement.dataset.page
                el.setAttribute("sandbox", SANDBOX);
                el.setAttribute("allow", ALLOW);
                el.setAttribute("allowfullscreen", "");
                el.referrerPolicy = "no-referrer";

                const g = gen;
                const ready = (async () => {
                    const html = await getPage(name);
                    if (g !== gen) throw new Error("stale");        // purged while fetching
                    await new Promise(done => {
                        el.addEventListener("load", () => {
                            const doc = el.contentDocument;
                            if (doc) {
                                const ic = doc.querySelector('link[rel~="icon"]');
                                meta.set(name, { title: doc.title || "", icon: ic ? ic.href : "" });
                                wire(doc);
                            }
                            done();
                        }, { once: true });
                        el.srcdoc = html;
                        stage.append(el);
                    });
                    return el;
                })();

                const entry = { el, ready };
                pages.set(name, entry);
                ready.catch(() => { if (pages.get(name) === entry) pages.delete(name); el.remove(); });
                return ready;
            }

            const idle = window.requestIdleCallback || (f => setTimeout(f, 800));
            function preload() {
                for (const n of CONFIG.preload || []) if (!pages.has(n)) ensure(n).catch(() => { });
            }

            function swap(name, el) {
                for (const f of stage.children) f.classList.toggle("on", f === el);
                current = name;
                window.currentpage = name;
                const m = meta.get(name) || {};
                document.title = m.title || document.title;
                if (m.icon) $("#icon").href = m.icon;
                setState("ready");
                try { el.contentWindow.focus(); } catch { }
                idle(preload);
            }

            async function show(want) {
                const name = want;
                const my = ++token;
                if (!pages.has(name)) {
                    if (current) document.body.classList.add("busy");   // stay on the current page, thin bar only
                    else setState("loading");                           // very first load: full loader
                }
                try {
                    const el = await ensure(name);
                    if (my !== token) return;
                    swap(name, el);
                } catch {
                    if (my !== token) return;
                    $("#fail-url").textContent = failUrl;
                    setState("failed");
                } finally {
                    if (my === token) document.body.classList.remove("busy");
                }
            }

            addEventListener("hashchange", () => show(pageFromHash()));
            $("#retry").addEventListener("click", async () => {
                refP = null; await resolveRef(true);
                show(pageFromHash());
            });

            show(pageFromHash());
        })();
    </script>
</body>

</html>
